name: Movie Bot Auto-Poster

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: movie-bot-worker
  cancel-in-progress: false

jobs:
  seed-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install & Build
        run: |
          npm install
          npm run build

      - name: Run Seeding & Publishing Loop (5 Hours)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
          LOG_CHANNEL: ${{ secrets.LOG_CHANNEL }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          CHATGPT_API_KEY: ${{ secrets.CHATGPT_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: npm run worker:once

      - name: Auto-Trigger Next 5-Hour Run
        if: always()
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/auto-poster.yml/dispatches" \
            -d '{"ref":"main"}'
